name: Enterprise AI Assistant CI/CD

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: rag-ai

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    steps:

      # ===============================
      # Checkout
      # ===============================
      - name: Checkout source code
        uses: actions/checkout@v4

      # ===============================
      # Setup Java
      # ===============================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # ===============================
      # Run Tests
      # ===============================
      - name: Run unit tests
        run: mvn clean test

      # ===============================
      # Build Application
      # ===============================
      - name: Build JAR
        run: mvn clean package -DskipTests

      # ===============================
      # Setup Docker
      # ===============================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ===============================
      # Login Docker Hub
      # ===============================
      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ===============================
      # Extract Version
      # ===============================
      - name: Extract version
        id: vars
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=${GITHUB_SHA::7}
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      # ===============================
      # Build & Push Docker Image
      # ===============================
      - name: Build and Push Docker Image
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.VERSION }}

      # ===============================
      # Deploy to EC2 (ONLY main branch)
      # ===============================
      - name: Deploy to EC2
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

            docker stop rag || true
            docker rm rag || true

            docker run -d \
              -p 8080:8080 \
              --env-file .env \
              --name rag \
              --restart unless-stopped \
              ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest