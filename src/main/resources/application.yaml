spring:
  application:
    name: LynorAI
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: none
#    properties:
#      hibernate:
#        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-5-nano}
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

# ===============================
# Demo configuration
# ===============================
app:
  version: ${APP_VERSION:0.0.1}
  git:
    commit: ${APP_GIT_COMMIT:unknown}
    build:
      time: ${APP_BUILD_TIME:unknown}
  demo:
    auto-cleanup-enabled: true
    cleanup-interval-hours: 4
  rate-limit:
    ask-per-10-minutes: 20
    upload-per-10-minutes: 2

logging:
  level:
    org.springframework.jdbc: INFO