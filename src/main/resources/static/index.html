<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LynorAI - Enterprise RAG Assistant</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/highlight.js/styles/github.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js/lib/common.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body class="bg-gray-100 min-h-screen">

<div class="max-w-6xl mx-auto p-4 md:p-8">

    <!-- HEADER -->
    <div class="mb-6 flex justify-between items-start">
        <div>
            <h1 class="text-2xl md:text-4xl font-bold">
                LynorAI Enterprise Assistant
            </h1>
            <div class="flex items-center gap-3 mt-2">
                <p class="text-gray-600">
                    Sandbox Demo
                </p>
                <span class="text-xs bg-gray-200 px-2 py-1 rounded-full">
                    Built by Duc Do, Luyen T(luyentmimon)
                </span>
            </div>
        </div>

        <div class="flex gap-4">
            <!-- GitHub -->
            <a href="https://github.com/devdao2002/enterprise-rag-assistant"
               target="_blank"
               class="text-gray-700 hover:text-black transition"
               title="GitHub">

                <svg xmlns="http://www.w3.org/2000/svg"
                     viewBox="0 0 24 24"
                     fill="currentColor"
                     class="w-6 h-6">
                    <path d="M12 0C5.37 0 0 5.37 0 12a12 12 0 008.2 11.4c.6.1.8-.2.8-.6v-2.3c-3.3.7-4-1.4-4-1.4-.6-1.5-1.4-1.9-1.4-1.9-1.2-.8.1-.8.1-.8 1.3.1 2 .1 2 .1 1.1 1.9 3 1.3 3.7 1 .1-.8.4-1.3.7-1.6-2.6-.3-5.4-1.3-5.4-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3 0 0 1-.3 3.3 1.2a11.4 11.4 0 016 0C17 4 18 4.3 18 4.3c.6 1.5.2 2.7.1 3 .7.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.4 5.9.4.4.8 1.1.8 2.2v3.2c0 .4.2.7.8.6A12 12 0 0024 12c0-6.63-5.37-12-12-12z"/>
                </svg>
            </a>

            <!-- LinkedIn -->
            <a href="https://linkedin.com/in/duc-do-00b7aa361"
               target="_blank"
               class="text-gray-700 hover:text-blue-700 transition"
               title="LinkedIn">

                <svg xmlns="http://www.w3.org/2000/svg"
                     viewBox="0 0 24 24"
                     fill="currentColor"
                     class="w-6 h-6">
                    <path d="M20.4 20.4h-3.6v-5.6c0-1.3 0-3-1.9-3s-2.2 1.5-2.2 2.9v5.7H9.1V9h3.5v1.6h.1c.5-.9 1.6-1.9 3.3-1.9 3.5 0 4.1 2.3 4.1 5.2v6.5zM5.3 7.4c-1.2 0-2.1-1-2.1-2.2S4.1 3 5.3 3s2.1 1 2.1 2.2-1 2.2-2.1 2.2zM7.1 20.4H3.5V9h3.6v11.4zM22.2 0H1.8C.8 0 0 .8 0 1.8v20.4C0 23.2.8 24 1.8 24h20.4c1 0 1.8-.8 1.8-1.8V1.8C24 .8 23.2 0 22.2 0z"/>
                </svg>
            </a>
        </div>
    </div>

    <!-- SANDBOX -->
    <div id="sandboxInfo"
         class="bg-blue-100 border border-blue-400 text-blue-800 p-4 rounded mb-6 text-sm">
        Initializing...
    </div>

    <!-- NOTICE -->
    <div id="limitsNotice"
         class="bg-yellow-100 border border-yellow-400 text-yellow-800 p-4 rounded mb-8 text-sm">
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- UPLOAD -->
        <div class="bg-white p-6 rounded shadow">
            <h2 class="text-xl font-semibold mb-4">Upload Document</h2>

            <input type="file"
                   id="fileInput"
                   accept="application/pdf"
                   class="mb-4 w-full"/>

            <button id="uploadBtn"
                    onclick="uploadFile()"
                    class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded w-full
                           disabled:bg-gray-400 disabled:cursor-not-allowed">
                Upload PDF
            </button>

            <div id="uploadStatus"
                 class="mt-4 text-sm break-words"></div>
        </div>

        <!-- CHAT -->
        <div class="bg-white p-6 rounded shadow flex flex-col">
            <h2 class="text-xl font-semibold mb-4">Ask Question</h2>

            <textarea id="question"
                      class="border p-3 rounded w-full mb-4 flex-1"
                      placeholder="Ask based on uploaded document..."></textarea>

            <button id="askBtn"
                    onclick="askQuestion()"
                    class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded w-full
                           disabled:bg-gray-400 disabled:cursor-not-allowed">
                Ask AI
            </button>

            <div id="answer"
                 class="mt-6 p-4 bg-gray-50 border rounded text-sm overflow-auto">
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="mt-16 border-t pt-6 text-center text-sm text-gray-500">
        © <span id="year"></span> Duc Do
        <div class="text-xs text-gray-400 mt-2" id="versionInfo">
            Loading version...
        </div>
    </footer>

</div>

<script>

    /* =====================================
       GLOBAL APP STATE
    ===================================== */

    const AppState = {
        version: {},
        sandbox: {
            token: null,
            active: false,
            remainingSeconds: 0
        },
        document: {
            ready: false
        },
        limits: {}
    };

    /* =====================================
       BOOTSTRAP
    ===================================== */

    document.addEventListener("DOMContentLoaded", bootstrapApp);

    async function bootstrapApp() {

        document.getElementById("year").innerText =
            new Date().getFullYear();

        try {

            const token = localStorage.getItem("sandboxToken");

            const res = await fetch("/api/bootstrap", {
                headers: token ? { "X-Sandbox-Token": token } : {}
            });

            const data = await res.json();

            hydrateState(data);

            if (data.sandbox.token) {
                localStorage.setItem("sandboxToken", data.sandbox.token);
            }

            renderAll();
            startCountdown();

        } catch (e) {
            showFatalError("Cannot initialize application.");
        }
    }

    /* =====================================
       STATE MANAGEMENT
    ===================================== */

    function hydrateState(data) {
        Object.assign(AppState.version, data.version);
        Object.assign(AppState.sandbox, data.sandbox);
        Object.assign(AppState.document.ready = data.documentReady);
        Object.assign(AppState.limits, data.limits);
    }

    /* =====================================
       RENDER
    ===================================== */

    function renderAll() {
        renderVersion();
        renderSandbox();
        renderLimits();
        renderButtons();
    }

    function renderVersion() {
        const el = document.getElementById("versionInfo");

        el.innerHTML = `
        Version ${AppState.version.version} •
        <a href="${AppState.version.commitUrl}"
           target="_blank"
           class="underline hover:text-gray-600">
           ${AppState.version.commitShort}
        </a>
    `;
    }

    function renderSandbox() {

        const el = document.getElementById("sandboxInfo");

        if (!AppState.sandbox.active) {
            el.innerHTML =
                `<span class="text-red-600">Sandbox inactive</span>`;
            return;
        }

        el.innerHTML = `
        <strong>Sandbox Active</strong><br/>
        <div class="text-xs font-mono">${AppState.sandbox.token}</div>
        <div>Expires in:
            <span id="countdown">
                ${formatTime(AppState.sandbox.remainingSeconds)}
            </span>
        </div>
    `;
    }

    function renderLimits() {

        document.getElementById("limitsNotice").innerHTML = `
         <strong>DEMO NOTICE:</strong><br/>
        - Upload limit: 2 files per 10 minutes per IP<br/>
        - Query limit: 20 requests per 10 minutes per IP<br/>
        - Max file size: 5MB<br/>
        - Only PDF files supported<br/>
        - Documents auto-deleted after 4 hours<br/>
        - Do NOT upload sensitive data
    `;
    }

    function renderButtons() {

        const uploadBtn = document.getElementById("uploadBtn");
        const askBtn = document.getElementById("askBtn");

        uploadBtn.disabled = !AppState.sandbox.active;
        askBtn.disabled =
            !AppState.sandbox.active ||
            !AppState.document.ready;
    }

    /* =====================================
       COUNTDOWN
    ===================================== */

    function startCountdown() {

        setInterval(() => {

            if (!AppState.sandbox.active) return;

            if (AppState.sandbox.remainingSeconds <= 0) {

                AppState.sandbox.active = false;
                renderAll();
                return;
            }

            AppState.sandbox.remainingSeconds--;

            const el = document.getElementById("countdown");
            if (el) {
                el.textContent =
                    formatTime(AppState.sandbox.remainingSeconds);
            }

        }, 1000);
    }

    function formatTime(seconds) {

        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = seconds % 60;

        return [
            h.toString().padStart(2, '0'),
            m.toString().padStart(2, '0'),
            s.toString().padStart(2, '0')
        ].join(':');
    }

    /* =====================================
       UPLOAD
    ===================================== */

    async function uploadFile() {

        const file = document.getElementById("fileInput").files[0];
        const statusEl = document.getElementById("uploadStatus");

        if (!file) {
            statusEl.innerText = "Select a file.";
            return;
        }

        statusEl.innerHTML =
            `<span class="text-yellow-600">Uploading...</span>`;

        const formData = new FormData();
        formData.append("file", file);

        const res = await fetch("/api/documents/upload", {
            method: "POST",
            body: formData,
            headers: {
                "X-Sandbox-Token": AppState.sandbox.token
            }
        });

        if (!res.ok) {
            const err = await res.json();
            statusEl.innerHTML =
                `<span class="text-red-600">${err.message}</span>`;
            return;
        }

        const data = await res.json();
        statusEl.innerHTML =
            `<span class="text-yellow-600">Processing...</span>`;

        pollStatus(data.documentId);
    }

    function pollStatus(documentId) {

        const interval = setInterval(async () => {

            const res = await fetch(
                `/api/documents/status/${documentId}`,
                {
                    headers: {
                        "X-Sandbox-Token":
                        AppState.sandbox.token
                    }
                }
            );

            if (!res.ok) {
                clearInterval(interval);
                return;
            }

            const data = await res.json();
            const statusEl =
                document.getElementById("uploadStatus");

            if (data.status === "READY") {
                statusEl.innerHTML =
                    `<span class="text-green-600">Document ready ✅</span>`;

                AppState.document.ready = true;
                renderButtons();
                clearInterval(interval);
            }

            if (data.status === "FAILED") {
                statusEl.innerHTML =
                    `<span class="text-red-600">Processing failed ❌</span>`;
                clearInterval(interval);
            }

        }, 3000);
    }

    /* =====================================
       ASK (SSE STREAM)
    ===================================== */

    async function askQuestion() {

        const question =
            document.getElementById("question").value;

        const answerEl =
            document.getElementById("answer");

        const askBtn =
            document.getElementById("askBtn");

        if (!question.trim()) return;

        answerEl.innerHTML =
            `<span class="text-gray-500">Thinking...</span>`;

        askBtn.disabled = true;

        const response = await fetch(
            `/api/ask/stream?question=${encodeURIComponent(question)}`,
            {
                headers: {
                    "X-Sandbox-Token":
                    AppState.sandbox.token
                }
            }
        );

        if (!response.ok) {
            const err = await response.json();
            answerEl.innerHTML =
                `<span class="text-red-600">${err.message}</span>`;
            askBtn.disabled = false;
            return;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        let buffer = "";
        let fullText = "";

        answerEl.innerHTML = "";

        while (true) {
            const { done, value } =
                await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });

            let newlineIndex;
            while ((newlineIndex = buffer.indexOf(`\n\n`)) >= 0) {
                let chunk = buffer.slice(0, newlineIndex).trim();
                buffer = buffer.slice(newlineIndex + 2);

                if (chunk.startsWith("data:")) {
                    const jsonStr = chunk.replace("data:", "").trim();
                    if (!jsonStr) continue;
                    try {
                        const obj = JSON.parse(jsonStr);

                        if (obj.type === "token") {
                            answerEl.innerText += obj.content;
                        }
                        if (obj.type === "sources") {
                            answerEl.innerText += "\nSource: " + obj.content;
                        }
                        if (obj.type === "done") {
                            answerEl.querySelectorAll(answerEl).forEach((block) => {
                                hljs.highlightElement(block);
                            });
                        }
                    } catch (e) {
                        console.error("Error parsing chunk", e, chunk);
                    }
                    // Auto-scroll inside chat
                    answerEl.scrollTop = answerEl.scrollHeight;
                }
            }
        }

        askBtn.disabled = false;
    }

    /* =====================================
       UTIL
    ===================================== */

    function showFatalError(msg) {
        document.body.innerHTML =
            `<div class="flex items-center justify-center h-screen">
            <div class="bg-red-100 border border-red-400
                        text-red-700 p-6 rounded">
                ${msg}
            </div>
        </div>`;
    }

</script>

</body>
</html>
