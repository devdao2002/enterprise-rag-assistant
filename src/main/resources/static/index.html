<!DOCTYPE html>
<html>
<head>
    <title>Enterprise AI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">

<div class="max-w-4xl mx-auto">

    <h1 class="text-3xl font-bold mb-6">
        Enterprise Internal AI Assistant
    </h1>

    <!-- Tenant -->
    <div class="mb-4">
        <label class="font-semibold">Tenant ID</label>
        <input id="tenantId"
               class="border p-2 w-full"
               value="11111111-1111-1111-1111-111111111111"/>
    </div>

    <!-- Upload -->
    <div class="bg-white p-6 rounded shadow mb-6">
        <h2 class="text-xl font-semibold mb-4">Upload Document</h2>
        <input type="file" id="fileInput" class="mb-4"/>
        <button onclick="uploadFile()"
                class="bg-blue-600 text-white px-4 py-2 rounded">
            Upload
        </button>
        <div id="uploadStatus" class="mt-2 text-sm"></div>
    </div>

    <!-- Chat -->
    <div class="bg-white p-6 rounded shadow">
        <h2 class="text-xl font-semibold mb-4">Ask Question</h2>
        <textarea id="question"
                  class="border p-2 w-full mb-4"
                  placeholder="Ask something..."></textarea>
        <button onclick="askQuestion()"
                class="bg-green-600 text-white px-4 py-2 rounded">
            Ask
        </button>

        <div id="answer"
             class="mt-6 p-4 bg-gray-50 border rounded whitespace-pre-wrap">
        </div>
    </div>

</div>

<script>

    async function uploadFile() {

        const file = document.getElementById("fileInput").files[0];
        const tenantId = document.getElementById("tenantId").value;

        const formData = new FormData();
        formData.append("file", file);
        formData.append("tenantId", tenantId);

        const res = await fetch("/api/documents/upload", {
            method: "POST",
            body: formData
        });

        const text = await res.text();
        document.getElementById("uploadStatus").innerText = text;
    }

    async function askQuestion() {

        const question = document.getElementById("question").value;
        const tenantId = document.getElementById("tenantId").value;

        const res = await fetch(
            `/api/ask?question=${encodeURIComponent(question)}&tenantId=${tenantId}`
        );

        const text = await res.text();
        document.getElementById("answer").innerText = text;
    }

</script>

</body>
</html>
